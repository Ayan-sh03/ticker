name: ticker

x-backend: &backend
  restart: unless-stopped
  init: true
  stop_grace_period: 15s
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-ticker}:${POSTGRES_PASSWORD:-ticker_dev}@db:5432/${POSTGRES_DB:-ticker}?sslmode=disable
    HTTP_ADDR: :8080
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    DB_MAX_CONNS: ${API_DB_MAX_CONNS:-12}
    REDIS_URL: redis://redis:6379/0
    RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
    RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-dev-only-rate-limit-secret-0123456789}
    # nginx at the edge overwrites X-Real-IP with the client address.
    CLIENT_IP_HEADER: X-Real-IP
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticker}
      POSTGRES_USER: ${POSTGRES_USER:-ticker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticker_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Rate-limit counters only. They expire within minutes, so nothing is persisted.
  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    build:
      context: .
      args:
        APP: api
    environment:
      <<: *backend-env
      SIGNUP_SECRET: ${SIGNUP_SECRET:-dev-only-signup-secret-0123456789abc}
      # Without a Resend key, signup codes appear in the API log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend
    build:
      context: .
      args:
        APP: worker
    environment:
      <<: *backend-env
      DB_MAX_CONNS: ${WORKER_DB_MAX_CONNS:-2}

  web:
    build:
      context: ./web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  edge:
    image: nginx:1.28-alpine-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - /migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-ticker}:${POSTGRES_PASSWORD:-ticker_dev}@db:5432/${POSTGRES_DB:-ticker}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: .
      args:
        APP: seed
    environment:
      <<: *backend-env
      DB_MAX_CONNS: 2
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: ["--dataset", "demo", "--seed", "42"]
    depends_on:
      db:
        condition: service_healthy

  # Read-only invariant check; exits 1 when any rule is violated.
  audit:
    profiles: ["tools"]
    build:
      context: .
      args:
        APP: audit
    environment:
      <<: *backend-env
      DB_MAX_CONNS: 1
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ticker_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
