# Reuse API connections instead of opening one per request. The idle timeout
# stays below the API's 60 s IdleTimeout so nginx never reuses a connection
# the API is closing.
upstream api {
    server api:8080;
    keepalive 32;
    keepalive_timeout 50s;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Room for a 1000-seat map in memory instead of a temp file.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
