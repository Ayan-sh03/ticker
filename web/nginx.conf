server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip_static on;
    gzip_vary on;

    # Only Vite's content-hashed assets are immutable. Missing assets must not
    # fall through to (and cache) the application HTML.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
